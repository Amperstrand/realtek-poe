#
# Build realtek-poe .ipk using the OpenWrt SDK Docker image.
#
# The SDK Docker image contains the cross-compiler toolchain and staged
# libraries. We mount this repo as a package directory inside the SDK tree
# and compile it into a ready-to-install .ipk artifact.
#
# Artifacts are tagged with branch name and commit SHA for easy identification.
#

name: Build .ipk

on:
  push:
    branches: [ "ai-experiments", "ai/**" ]
  pull_request:
    branches: [ "ai-experiments" ]
  workflow_dispatch:  # Allow manual trigger from any branch

jobs:
  build:
    name: Build realtek-poe .ipk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build directory
        run: |
          mkdir $GITHUB_WORKSPACE/bin
          sudo chown -R 1000:1000 $GITHUB_WORKSPACE

      - name: Build in OpenWrt SDK container
        run: |
          docker run --rm \
            -v $GITHUB_WORKSPACE/bin:/home/build/openwrt/bin \
            -v $GITHUB_WORKSPACE:/home/build/openwrt/package/realtek-poe \
            openwrt/sdk:realtek-rtl838x-snapshot \
            /bin/bash -c " \
              ./scripts/feeds update base \
              && ./scripts/feeds install libubus libuci \
              && make defconfig \
              && make package/realtek-poe/compile -j\$(nproc) V=s
            "

      - name: Rename artifact with branch and commit
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          # Sanitize branch name for artifact naming (replace / with -)
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          ARTIFACT_NAME="realtek-poe_${SAFE_BRANCH}_${SHORT_SHA}"

          # Find and rename the .ipk
          SRCDIR="bin/packages/mips_4kec/base"
          if [ -d "$SRCDIR" ]; then
            mkdir -p dist
            for f in "$SRCDIR"/realtek-poe_*.ipk; do
              BASENAME=$(basename "$f")
              # Insert branch+sha before .ipk extension
              NEWNAME="${BASENAME%.ipk}_${SAFE_BRANCH}_${SHORT_SHA}.ipk"
              cp "$f" "dist/$NEWNAME"
              echo "Built: dist/$NEWNAME"
            done
          else
            echo "ERROR: No .ipk found in $SRCDIR"
            find bin -name "*.ipk" 2>/dev/null
            exit 1
          fi

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: realtek-poe-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*.ipk
          retention-days: 30
