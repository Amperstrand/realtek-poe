#
# Build realtek-poe .ipk using the OpenWrt SDK Docker image.
#
# The SDK Docker image contains the cross-compiler toolchain and staged
# libraries. We mount this repo as a package directory inside the SDK tree
# and compile it into a ready-to-install .ipk artifact.
#
# Artifacts are tagged with branch name and commit SHA for easy identification.
#

name: Build .ipk

on:
  push:
    branches: [ "ai-experiments", "ai/**" ]
  pull_request:
    branches: [ "ai-experiments" ]
  workflow_dispatch:  # Allow manual trigger from any branch

jobs:
  build:
    name: Build realtek-poe .ipk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build directory
        run: |
          mkdir $GITHUB_WORKSPACE/bin
          mkdir $GITHUB_WORKSPACE/dist
          sudo chown -R 1000:1000 $GITHUB_WORKSPACE

      - name: Build in OpenWrt SDK container
        run: |
          docker run --rm \
            -v $GITHUB_WORKSPACE/bin:/builder/bin \
            -v $GITHUB_WORKSPACE:/builder/package/realtek-poe \
            openwrt/sdk:realtek-rtl838x-25.12.1 \
            /bin/bash -c " \
              ./scripts/feeds update base \
              && ./scripts/feeds install libubus libuci \
              && make defconfig \
              && make package/realtek-poe/compile -j\$(nproc) V=s
            "

      - name: Restore workspace ownership
        run: sudo chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE

      - name: Rename artifact with branch and commit
        id: rename
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          # Sanitize branch name for artifact naming (replace / with -)
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          echo "safe_branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

          echo "=== Searching for built packages ==="
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) 2>/dev/null

          # Find all package files and copy to dist with branch+sha tag
          FOUND=0
          for f in $(find bin -type f \( -name "realtek-poe*.ipk" -o -name "realtek-poe*.apk" \) 2>/dev/null); do
            BASENAME=$(basename "$f")
            EXT="${BASENAME##*.}"
            STEM="${BASENAME%.*}"
            NEWNAME="${STEM}_${SAFE_BRANCH}_${SHORT_SHA}.${EXT}"
            cp "$f" "dist/$NEWNAME"
            echo "Built: dist/$NEWNAME"
            FOUND=1
          done

          if [ "$FOUND" = "0" ]; then
            echo "ERROR: No realtek-poe package found"
            echo "=== Full bin/ tree ==="
            find bin -type f 2>/dev/null || echo "bin/ is empty"
            ls -laR bin/ 2>/dev/null | head -40
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: realtek-poe-${{ steps.rename.outputs.safe_branch }}-${{ github.sha }}
          path: dist/*
          retention-days: 30
